[toolchain]
anchor_version = "0.31.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
torus_protocol = "6n1Nme9H1aUoXY2P2RaHBVWKAHHyEVPjx9n8WdU8oGdR"
torus_hook = "9LtyE8m84qUm9qeyLSLzTJUC3cUXNvL2HVp9ctqdi21a"

[programs.devnet]
torus_protocol = "6n1Nme9H1aUoXY2P2RaHBVWKAHHyEVPjx9n8WdU8oGdR"
torus_hook = "9LtyE8m84qUm9qeyLSLzTJUC3cUXNvL2HVp9ctqdi21a"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 120000
# initialize is restricted to the program's upgrade authority, so tests deploy the programs as upgradeable.
upgradeable = true

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# NOTE: with your own program keys, run
#   anchor keys sync
# (updates declare_id! in each lib.rs). It does NOT update TORUS_PROTOCOL_ID in torus-hook/src/lib.rs:
# set it to torus_protocol's program id by hand, otherwise the hook derives TokenState at the wrong address
# and the freeze check stops working.
